[package]
name = "set10-mixing-desk"
version = "0.1.0"
description = "Set 10 Remix Rumble mixing desk"
edition = "2021"
rust-version = "1.77"

[lib]
name = "set10_mixing_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
